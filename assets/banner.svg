<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" aria-label="360 Muslim Experts Banner">
  <defs>
    <!-- Rich Emerald & Deep Forest Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041E12"/>
      <stop offset="45%" stop-color="#0A331D"/>
      <stop offset="80%" stop-color="#124D2D"/>
      <stop offset="100%" stop-color="#1A663C"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9E5B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#124D2D" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Islamic Geometric Star Pattern Motif -->
    <pattern id="geoPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <g stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.07" fill="none">
        <rect x="0" y="0" width="60" height="60"/>
        <path d="M 30,0 L 60,30 L 30,60 L 0,30 Z"/>
        <path d="M 0,0 L 60,60 M 60,0 L 0,60"/>
        <circle cx="30" cy="30" r="12"/>
        <circle cx="30" cy="30" r="21"/>
      </g>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Geometric Pattern Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#geoPattern)"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="60" r="180" fill="#2E9E5B" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="260" r="200" fill="#D4AF37" opacity="0.08" filter="url(#glow)"/>

  <!-- Glassmorphic Outer Card Border Frame -->
  <rect x="12" y="12" width="1176" height="296" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Header Emblem / 360 Geometric Compass Motif -->
  <g transform="translate(600, 75)" filter="url(#shadow)">
    <!-- Outer Octagram Ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#2E9E5B" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Geometric Star -->
    <path d="M0,-20 L5,-6 L19,-19 L6,-5 L20,0 L6,5 L19,19 L5,6 L0,20 L-5,6 L-19,19 L-6,5 L-20,0 L-6,-5 L-19,-19 L-5,-6 Z" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- Inner Core -->
    <circle cx="0" cy="0" r="8" fill="#0A331D" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Title Text -->
  <text x="600" y="155" text-anchor="middle" fill="#FFFFFF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif"
        font-size="42" font-weight="800" letter-spacing="3" filter="url(#shadow)">
    360 MUSLIM EXPERTS
  </text>

  <!-- Gold Accent Line -->
  <path d="M 450 172 L 550 172 M 650 172 L 750 172" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="600" cy="172" r="3.5" fill="#D4AF37"/>

  <!-- Tagline Text -->
  <text x="600" y="205" text-anchor="middle" fill="#D2F0DF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif"
        font-size="18" font-weight="500" letter-spacing="1.5">
    BRIDGING TRADITION &amp; MODERN INNOVATION
  </text>

  <!-- Interactive/Pill Badges Group -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: Scholars -->
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="url(#emeraldGlass)" stroke="#2E9E5B" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="-50" cy="0" r="4" fill="#D4AF37"/>
      <text x="5" y="5" text-anchor="middle" fill="#E8F7EE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SCHOLARS</text>
    </g>

    <!-- Pill 2: Medical Professionals -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="url(#emeraldGlass)" stroke="#2E9E5B" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="-75" cy="0" r="4" fill="#2E9E5B"/>
      <text x="5" y="5" text-anchor="middle" fill="#E8F7EE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MEDICAL PROFESSIONALS</text>
    </g>

    <!-- Pill 3: Engineers & Tech -->
    <g transform="translate(240, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="url(#emeraldGlass)" stroke="#2E9E5B" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="-65" cy="0" r="4" fill="#60A5FA"/>
      <text x="5" y="5" text-anchor="middle" fill="#E8F7EE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ENGINEERS &amp; TECH</text>
    </g>
  </g>
</svg>
